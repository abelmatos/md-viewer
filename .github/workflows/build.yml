name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows]
    env:
      GOOS: ${{ matrix.goos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test with the race detector
        run: go test -race ./...

      - name: Fuzz link resolution
        run: go test -run '^$' -fuzz FuzzResolve -fuzztime 30s ./internal/doc

      - name: Known vulnerabilities
        # Install for the runner first: GOOS=windows go run would build a
        # Windows binary.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
          GOOS=windows govulncheck ./...

      - name: Windows resources match winres/
        run: |
          go generate ./...
          git diff --exit-code -- '*.syso'

  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet and test
        run: |
          go mod verify
          go vet ./...
          go test ./...

      - name: Build Windows binaries
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
            # Stamp the release version into the exe's version resource.
            go tool go-winres make --arch amd64,arm64 \
              --product-version "${version#v}" --file-version "${version#v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          flags=(-trimpath -ldflags="-s -w -H windowsgui -X main.version=$version")
          GOARCH=amd64 go build "${flags[@]}" -o md-viewer.exe .
          GOARCH=arm64 go build "${flags[@]}" -o md-viewer-arm64.exe .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: md-viewer-exe
          path: |
            md-viewer.exe
            md-viewer-arm64.exe
          retention-days: 90
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: md-viewer-exe

      - name: Checksums
        run: sha256sum md-viewer.exe md-viewer-arm64.exe > SHA256SUMS

      # Signed statement that these files were built by this workflow from
      # this commit: verify with `gh attestation verify md-viewer.exe -R abelmatos/md-viewer`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            md-viewer.exe
            md-viewer-arm64.exe

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            md-viewer.exe
            md-viewer-arm64.exe
            SHA256SUMS
          generate_release_notes: true
