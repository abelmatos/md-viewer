version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a week before proposing them. Security updates
    # ignore this.
    cooldown:
      default-days: 7
    # Indirect dependencies too: the sanitiser's golang.org/x/net is one.
    allow:
      - dependency-type: all
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a week before proposing them. Security updates
    # ignore this.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
